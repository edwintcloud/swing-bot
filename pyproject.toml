[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "swing-bot"
version = "0.1.0"
description = "NautilusTrader SMA continuation strategy for Interactive Brokers"
license = { file = "LICENSE" }
requires-python = ">=3.13,<3.14"
dependencies = [
    "nautilus_trader[ib,docker,visualization]==1.231.0",
]

[project.scripts]
swing-bot = "swing_bot.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/swing_bot"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
